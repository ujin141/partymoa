<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>예매자 42명 성별 채우기</title>
<style>
  :root { --bg:#0d0b14; --card:#17141f; --line:#2a2536; --ink:#f4f2f8;
          --sub:#9a93ad; --f:#e8447a; --m:#3d7dff; --ok:#7c3aed; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent }
  body { margin:0; background:var(--bg); color:var(--ink); font-weight:600;
         font-family:Pretendard,-apple-system,'Segoe UI','Malgun Gothic',sans-serif; }
  .wrap { max-width:560px; margin:0 auto; padding:20px 16px 130px }
  h1 { font-size:20px; margin:0 0 6px }
  .lead { color:var(--sub); font-size:13.5px; line-height:1.7; margin:0 0 18px; font-weight:500 }
  .sec { color:var(--sub); font-size:12px; letter-spacing:.08em; margin:22px 0 8px }
  .row { display:flex; align-items:center; gap:10px; padding:7px 0;
         border-bottom:1px solid var(--line) }
  .no { width:24px; color:var(--sub); font-size:12px; font-variant-numeric:tabular-nums }
  .nm { flex:1; min-width:0; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .btns { display:flex; gap:6px }
  button.g { width:46px; height:34px; border:1px solid var(--line); background:var(--card);
             color:var(--sub); border-radius:9px; font-size:14px; font-weight:800;
             font-family:inherit; cursor:pointer }
  button.g.on[data-g="F"] { background:var(--f); border-color:var(--f); color:#fff }
  button.g.on[data-g="M"] { background:var(--m); border-color:var(--m); color:#fff }
  .bar { position:fixed; left:0; right:0; bottom:0; background:#12101a;
         border-top:1px solid var(--line); padding:12px 16px calc(12px + env(safe-area-inset-bottom)) }
  .bar .in { max-width:560px; margin:0 auto; display:flex; align-items:center; gap:12px }
  .cnt { font-size:13.5px; color:var(--sub); flex:1 }
  .cnt b { color:var(--ink) }
  button.go { border:0; border-radius:11px; padding:12px 20px; font-size:15px; font-weight:800;
              font-family:inherit; background:var(--ok); color:#fff; cursor:pointer }
  button.go:disabled { background:#2a2536; color:#6c6482; cursor:default }
  .done { display:none; margin-top:16px; font-size:13px; color:var(--sub); line-height:1.8 }
</style></head><body>
<div class="wrap">
  <h1>예매자 42명 성별</h1>
  <p class="lead">성비 마감(남녀 각 40명)과 금액 계산에 씁니다.
     남성은 계수 1.25가 붙어 1차가 39,000이 아니라 49,000으로 잡힙니다.<br>
     다 누르면 아래 버튼으로 SQL 이 복사됩니다. Supabase SQL Editor 에 붙여 넣고 Run 하세요.</p>
  <div id="list"></div>
  <p class="done" id="done"></p>
</div>
<div class="bar"><div class="in">
  <span class="cnt"><b id="n">0</b> / 42</span>
  <button class="go" id="copy" disabled>SQL 복사</button>
</div></div>
<script>
const NL = String.fromCharCode(10);
const PEOPLE = [{"n": "선우윤아", "t": 1}, {"n": "박민지", "t": 1}, {"n": "이민재", "t": 1}, {"n": "박천준", "t": 1}, {"n": "이재현", "t": 1}, {"n": "윤승우", "t": 1}, {"n": "송문수", "t": 1}, {"n": "조민재", "t": 1}, {"n": "왕인혁", "t": 1}, {"n": "송혜정", "t": 1}, {"n": "안주희", "t": 1}, {"n": "홍지원", "t": 1}, {"n": "이다인", "t": 1}, {"n": "신연주", "t": 1}, {"n": "김진수", "t": 1}, {"n": "공지환", "t": 1}, {"n": "원세현", "t": 1}, {"n": "엄희락", "t": 1}, {"n": "limanastasiyaolegovna", "t": 1}, {"n": "skb", "t": 1}, {"n": "최민경", "t": 2}, {"n": "임사무엘", "t": 2}, {"n": "조주안", "t": 2}, {"n": "김민석", "t": 2}, {"n": "이상원", "t": 2}, {"n": "김종원", "t": 2}, {"n": "신한빈", "t": 2}, {"n": "정건희", "t": 2}, {"n": "김태현", "t": 2}, {"n": "유종원", "t": 2}, {"n": "정주연", "t": 2}, {"n": "박성수", "t": 2}, {"n": "유혜준", "t": 2}, {"n": "우상민", "t": 2}, {"n": "성하늘", "t": 2}, {"n": "장건우", "t": 2}, {"n": "신윤정", "t": 2}, {"n": "김태준", "t": 2}, {"n": "최대성", "t": 2}, {"n": "서교빈", "t": 2}, {"n": "별", "t": 2}, {"n": "정동윤", "t": 2}];
const HEAD = "-- ═══════════════════════════════════════════════════════════════════\n--  이미 예매·입금한 42명을 명단에 올린다   (1차 20 · 2차 22)\n--\n--  ⬛ 가운데 '?' 를 'F'(여) 또는 'M'(남) 으로 바꾸세요.\n--\n--  하나라도 '?' 로 남아 있으면 **아무것도 안 들어가고 멈춥니다.**\n--  성별을 잘못 넣으면 그 성별이 먼저 마감돼서, 실제로는 자리가 있는데\n--  예매가 막힙니다. 그래서 추측으로 채우지 않았습니다.\n--\n--  맨 끝 숫자는 차수입니다. 앞 20명을 1차, 뒤 22명을 2차로 뒀습니다.\n--  순서가 다르면 그 숫자만 바꾸세요 — 금액이 따라 바뀝니다.\n--\n--  연락처는 비워 둡니다. 현장 입장은 이름으로 찾습니다.\n--  같은 이름은 건너뛰니 두 번 돌려도 안 겹칩니다.\n-- ═══════════════════════════════════════════════════════════════════\n\ndo $imp$\ndeclare\n  v_event uuid;\n  v_tier  uuid;\n  v_price int;\n  r       record;\n  n       int := 0;\nbegin\n  select id into v_event from events where slug = 'after-sunset-20260829';\n  if v_event is null then\n    raise exception '행사가 없습니다. SETUP.sql 을 먼저 돌리세요.';\n  end if;\n\n  if (select count(*) from ticket_tiers where event_id = v_event) < 2 then\n    raise exception '차수가 2개 미만입니다. SETUP.sql 을 먼저 돌리세요.';\n  end if;\n\n  for r in\n    select * from (values";
const TAIL = "    ) as t(nm, gd, tr)\n  loop\n    if r.gd not in ('F', 'M') then\n      raise exception '% 의 성별이 아직 ? 입니다. 전부 F 또는 M 으로 바꾸세요.', r.nm;\n    end if;\n\n    if exists (select 1 from bookings\n               where event_id = v_event and name = r.nm and status <> 'cancelled') then\n      continue;\n    end if;\n\n    select id into v_tier from ticket_tiers\n    where event_id = v_event order by sort_order offset (r.tr - 1) limit 1;\n\n    -- 금액은 앱과 같은 규칙 — 차수가 여성 기준가, 남성은 계수를 곱해 천 원 반올림\n    select round(\n      case when r.gd = 'M' then t.price * e.male_price_multiplier\n           else t.price::numeric end / 1000.0)::int * 1000\n    into v_price\n    from ticket_tiers t join events e on e.id = t.event_id where t.id = v_tier;\n\n    insert into bookings (code, event_id, tier_id, user_id, name, phone, gender,\n                          quantity, amount, invite_code, status, paid_at, expires_at)\n    values ('PM' || lpad(nextval('booking_code_seq')::text, 4, '0'),\n            v_event, v_tier, null, r.nm, '', r.gd,\n            1, v_price, null, 'paid', now(), now() + interval '24 hours');\n    n := n + 1;\n  end loop;\n\n  -- **1차를 마감시킨다.** 20장에서 끝났는데 정원이 40으로 남아 있으면\n  -- 앱이 1차를 39,000원에 또 판다. 판매량에 맞춰 닫는다\n  update ticket_tiers t\n  set capacity = (select sold from tier_stats s where s.tier_id = t.id)\n  where t.event_id = v_event and t.sort_order = 0\n    and (select sold from tier_stats s where s.tier_id = t.id) > 0;\n\n  raise notice '%명 올렸습니다', n;\nend $imp$;\n\nselect\n  (select count(*) from bookings where status <> 'cancelled') as 예매건수,\n  (select booked   from event_stats limit 1) as 예매인원,\n  (select booked_f from event_stats limit 1) as 여성,\n  (select booked_m from event_stats limit 1) as 남성,\n  (select capacity - booked from event_stats limit 1) as 잔여,\n  (select revenue_paid from event_stats limit 1) as 확정매출;\n\nselect t.name as 차수, t.price as 여성가, s.sold as 판매, t.capacity as 정원,\n       t.capacity - s.sold as 남은장수\nfrom ticket_tiers t join tier_stats s on s.tier_id = t.id\norder by t.sort_order;\n";
const pick = new Array(PEOPLE.length).fill(null);
const list = document.getElementById('list');
const w = Math.max(...PEOPLE.map(p => [...p.n].length));

PEOPLE.forEach((p, i) => {
  if (i === 0)  list.insertAdjacentHTML('beforeend', '<div class="sec">1차 20명</div>');
  if (i === 20) list.insertAdjacentHTML('beforeend', '<div class="sec">2차 22명</div>');
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = '<span class="no">' + (i + 1) + '</span>' +
    '<span class="nm"></span><span class="btns">' +
    '<button class="g" data-g="F">F</button><button class="g" data-g="M">M</button></span>';
  row.querySelector('.nm').textContent = p.n;
  row.querySelectorAll('button').forEach(b => b.onclick = () => {
    pick[i] = b.dataset.g;
    row.querySelectorAll('button').forEach(o => o.classList.toggle('on', o === b));
    tally();
  });
  list.appendChild(row);
});

function tally() {
  const n = pick.filter(Boolean).length;
  document.getElementById('n').textContent = n;
  document.getElementById('copy').disabled = n < PEOPLE.length;
}

function sql() {
  const rows = PEOPLE.map((p, i) => {
    const pad = ' '.repeat(w - [...p.n].length);
    const comma = i < PEOPLE.length - 1 ? ',' : ' ';
    return "    ('" + p.n + "'," + pad + " '" + pick[i] + "', " + p.t + ")" + comma +
           '   -- ' + String(i + 1).padStart(2, ' ');
  }).join(NL);
  return HEAD + NL + rows + NL + TAIL;
}

document.getElementById('copy').onclick = async () => {
  const t = sql();
  try { await navigator.clipboard.writeText(t); }
  catch (e) {
    const a = document.createElement('textarea');
    a.value = t; document.body.appendChild(a); a.select();
    document.execCommand('copy'); a.remove();
  }
  const f = pick.filter(g => g === 'F').length;
  const d = document.getElementById('done');
  d.style.display = 'block';
  d.textContent = '복사했습니다. 여성 ' + f + '명 · 남성 ' + (pick.length - f) +
    '명. Supabase SQL Editor 에 붙여 넣고 Run 하세요.';
  document.getElementById('copy').textContent = '복사됨';
};
</script></body></html>
